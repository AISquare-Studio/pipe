# Labelled tool-search cases over the six native toolkits, for
# tests/evals/test_tool_search_eval.py.
#
# Each case: the query a user (or an agent on their behalf) would type, the
# connector whose tools answer it, and every slug that is an acceptable
# answer. `across: all` searches the six toolkits together (multi-connector);
# otherwise only `connector` is searched. `kinds` tags the case:
#   paraphrase   no query word shares a stem with any acceptable slug
#                (checked by the test)
#   first_person "my ...", "... me", "I ..."
#   write        the user wants to change something
#   multi        searched across all six toolkits
#   named        multi, and the query names the connector that answers it
#                (name, display name, slug-prefix spelling or a card keyword)
#                next to a word another connector's tools match
#   incidental   multi, and the query mentions another connector only as a
#                topic (`mentions`): that connector must not be pushed to
#                rank 1, and the answer must rank no worse than with no
#                named-connector boost at all
#
# Cases are phrased the way people ask, not the way slugs read. Don't tune a
# case to the ranker; add a synonym or a tag instead, and keep the case.


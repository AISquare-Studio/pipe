[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aisquare-pipe-googledrive"
version = "0.3.0"
description = "Google Drive source, sink and toolkit (search, download/export, upload, share) for aisquare.pipe"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "AISquare Studio"}]
dependencies = [
    "aisquare-pipe>=0.4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy", "types-requests"]

[project.entry-points."aisquare_pipe.connectors"]
googledrive-source = "aisquare_pipe_googledrive.connector:GoogleDriveSource"
googledrive-sink = "aisquare_pipe_googledrive.connector:GoogleDriveSink"

[project.entry-points."aisquare_pipe.toolkits"]
googledrive = "aisquare_pipe_googledrive.toolkit:GoogleDriveToolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.isort]
# Same import grouping whatever directory ruff runs from (the repo root sees
# src/aisquare as first-party otherwise).
known-first-party = ["aisquare_pipe_googledrive"]
known-third-party = ["aisquare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs using env credentials; deselected by default"]
addopts = "-m 'not live'"

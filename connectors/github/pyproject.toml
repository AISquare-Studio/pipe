[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aisquare-pipe-github"
version = "0.2.0"
description = "GitHub toolkit (repos, code, issues, pull requests) and single-repo checkout source for aisquare.pipe"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "A-Square"}]
dependencies = [
    "aisquare-pipe>=0.3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-cov", "ruff", "mypy", "types-requests"]

[project.entry-points."aisquare_pipe.connectors"]
github-source = "aisquare_pipe_github.connector:GitHubRepoSource"

[project.entry-points."aisquare_pipe.toolkits"]
github = "aisquare_pipe_github.toolkit:GitHubToolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.isort]
# Same import grouping whatever directory ruff runs from (the repo root sees
# src/aisquare as first-party otherwise).
known-first-party = ["aisquare_pipe_github"]
known-third-party = ["aisquare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs using env credentials; deselected by default"]
addopts = "-m 'not live'"

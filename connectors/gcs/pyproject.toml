# Tool settings only (pytest, ruff) for running this connector's suite from
# its own directory. This connector isn't a separate package: it ships inside
# the `aisquare-pipe` distribution, packaged by the root pyproject.toml (its
# entry points, and its third-party deps as the `[gcs]` extra).

[tool.ruff.lint.isort]
# Same import grouping whatever directory ruff runs from (the repo root sees
# src/aisquare as first-party otherwise).
known-first-party = ["aisquare_pipe_gcs"]
known-third-party = ["aisquare", "google"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs using env credentials; deselected by default"]
addopts = "-m 'not live'"

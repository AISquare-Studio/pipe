# Tool settings only (pytest, ruff) for running this connector's suite from
# its own directory. This connector isn't a separate package: it ships inside
# the `aisquare-pipe` distribution, packaged by the root pyproject.toml (its
# entry points, and its third-party deps as the `[dropbox]` extra).

[tool.pytest.ini_options]
testpaths = ["tests"]

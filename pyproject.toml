[build-system]
requires = ["setuptools>=84.2.1", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aisquare-pipe"
version = "0.5.0"
description = "Universal anything-to-anything connector framework"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "AISquare Studio"}]
keywords = ["connectors", "data-pipeline", "etl", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    # Used by most connectors, so they ship with the core.
    "requests>=2.34.2",
    "urllib3>=1.26",
]

[project.urls]
Homepage = "https://github.com/AISquare-Studio/pipe"
Repository = "https://github.com/AISquare-Studio/pipe"
Documentation = "https://github.com/AISquare-Studio/pipe#readme"
Issues = "https://github.com/AISquare-Studio/pipe/issues"
Changelog = "https://github.com/AISquare-Studio/pipe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyyaml",
    "types-requests",
    "responses",
    # AWS fakes (STS, S3) for connectors/aws's hermetic tests.
    "moto[s3,sts]>=5.0,<6",
]
# One extra per connector, named after its directory (connectors/<name>,
# module aisquare_pipe_<name>): that connector's third-party deps beyond the
# core ones. It may be empty, and `pip install "aisquare-pipe[<name>]"` always
# works. Without it the connector's code is installed but its entry points
# count as not installed (the registry logs that at info level).
# tests/test_distribution.py keeps these in step with connectors/.
# AWS (cross-account role): AgentCore Policy (bedrock-agentcore-control
# ListPolicyEngines / ListPolicies / GetPolicy) is in botocore's model from
# 1.42.60 (GA), but a policy's enforcementMode only from 1.43.32: botocore
# drops response members its model lacks, so an older one silently loses it.
aws = [
    "boto3>=1.43.32,<2",
    "botocore>=1.43.32,<2",
]
# Composio: every composio release pins composio-client exactly, so the
# client range picks the SDK. 1.x and 2.x are both supported (2.x moved the
# trigger log to client._internal; aisquare_pipe_composio.client handles
# both, and its tests/test_sdk_compat.py runs on the installed real SDK).
composio = [
    "composio>=0.13.1,<2.0",
    "composio-client>=1.39,<3.0",
]
docusign = [
    "docusign-esign>=4.0",
]
dropbox = [
    "dropbox>=12.0",
]
gateway = []
github = []
# Glean: HTTP via requests (core), no deps of its own.
glean = []
gmail = []
googlecalendar = []
googledrive = []
graphify = [
    "tiktoken>=0.7",
]
# The graph engine itself, heavy and pinned; not part of [full].
graphify-engine = ["graphifyy==0.9.106"]
local = []
n8n = []
onedrive = [
    "azure-identity>=1.27.0",
]
salesforce = [
    "simple-salesforce>=1.12",
]
slack = []
# Bundles of connector extras.
popular = ["aisquare-pipe[local,dropbox,onedrive,googledrive]"]
# Every connector's deps (graphify's engine stays separate).
full = ["aisquare-pipe[popular,aws,composio,docusign,gateway,github,glean,gmail,googlecalendar,graphify,n8n,salesforce,slack]"]
# The deps of every connector that registers an `aisquare_pipe.toolkits`
# entry point. Hosts (pipe-as-service) install this to serve every toolkit;
# scripts/check_toolkits_extra.py (CI) keeps it complete.
toolkits = ["aisquare-pipe[aws,github,glean,gmail,googlecalendar,googledrive,onedrive,slack]"]

[project.scripts]
pipe = "aisquare.pipe.cli.main:cli"

[project.entry-points."aisquare_pipe.connectors"]
mock-source = "aisquare.pipe.testing.mock_connectors:MockSource"
mock-sink = "aisquare.pipe.testing.mock_connectors:MockSink"
bedrock-agentcore-policies-source = "aisquare_pipe_aws.connector:BedrockAgentCorePoliciesSource"
s3-source = "aisquare_pipe_aws.connector:S3Source"
composio-source = "aisquare_pipe_composio.connector:ComposioSource"
composio-sink = "aisquare_pipe_composio.connector:ComposioSink"
composio-triggers-source = "aisquare_pipe_composio.triggers:ComposioTriggersSource"
docusign-source = "aisquare_pipe_docusign.connector:DocusignSource"
docusign-sink = "aisquare_pipe_docusign.connector:DocusignSink"
dropbox-source = "aisquare_pipe_dropbox.connector:DropboxSource"
dropbox-sink = "aisquare_pipe_dropbox.connector:DropboxSink"
aisquare-gateway-sink = "aisquare_pipe_gateway.connector:AISquareGatewaySink"
github-source = "aisquare_pipe_github.connector:GitHubRepoSource"
glean-source = "aisquare_pipe_glean.connector:GleanSource"
googledrive-source = "aisquare_pipe_googledrive.connector:GoogleDriveSource"
googledrive-sink = "aisquare_pipe_googledrive.connector:GoogleDriveSink"
graphify-source = "aisquare_pipe_graphify.connector:GraphifySource"
local-source = "aisquare_pipe_local.connector:LocalSource"
local-sink = "aisquare_pipe_local.connector:LocalSink"
n8n-source = "aisquare_pipe_n8n.connector:N8nSource"
onedrive-source = "aisquare_pipe_onedrive.connector:OneDriveSource"
onedrive-sink = "aisquare_pipe_onedrive.connector:OneDriveSink"
salesforce-source = "aisquare_pipe_salesforce.connector:SalesforceSource"
salesforce-sink = "aisquare_pipe_salesforce.connector:SalesforceSink"
slack-message-sink = "aisquare_pipe_slack.connector:SlackMessageSink"

[project.entry-points."aisquare_pipe.converters"]
mock-converter = "aisquare.pipe.testing.mock_connectors:MockConverter"
graphify-converter = "aisquare_pipe_graphify.converter:GraphifyConverter"

[project.entry-points."aisquare_pipe.toolkits"]
mock = "aisquare.pipe.testing.mock_connectors:MockToolkit"
bedrock_agentcore = "aisquare_pipe_aws.toolkit:BedrockAgentCoreToolkit"
s3 = "aisquare_pipe_aws.toolkit:S3Toolkit"
github = "aisquare_pipe_github.toolkit:GitHubToolkit"
glean = "aisquare_pipe_glean.toolkit:GleanToolkit"
gmail = "aisquare_pipe_gmail.toolkit:GmailToolkit"
googlecalendar = "aisquare_pipe_googlecalendar.toolkit:GoogleCalendarToolkit"
googledrive = "aisquare_pipe_googledrive.toolkit:GoogleDriveToolkit"
onedrive = "aisquare_pipe_onedrive.toolkit:OneDriveToolkit"
slack = "aisquare_pipe_slack.toolkit:SlackToolkit"
[tool.setuptools.packages.find]
# The framework, then every connector's src dir. Each connector keeps its
# own directory (code, tests, README); only this file packages it.
where = [
    "src",
    "connectors/aws/src",
    "connectors/composio/src",
    "connectors/docusign/src",
    "connectors/dropbox/src",
    "connectors/gateway/src",
    "connectors/github/src",
    "connectors/glean/src",
    "connectors/gmail/src",
    "connectors/googlecalendar/src",
    "connectors/googledrive/src",
    "connectors/graphify/src",
    "connectors/local/src",
    "connectors/n8n/src",
    "connectors/onedrive/src",
    "connectors/salesforce/src",
    "connectors/slack/src",
]

[tool.setuptools.package-data]
"aisquare.pipe" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# src/aisquare is a namespace package: map files under src/ to their
# aisquare.* module names so `mypy src` works with an editable install.
mypy_path = "src"
explicit_package_bases = true

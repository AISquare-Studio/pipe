name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Every package that registers an aisquare_pipe.toolkits entry point is
      # in the root [toolkits] extra, and nothing else is (reads pyproject
      # files only, so it runs before the install).
      - name: toolkits extra
        run: python scripts/check_toolkits_extra.py

      - name: Install framework + all connectors
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          for dir in connectors/*/; do
            pip install -e "$dir"
          done

      - name: pipe validate
        shell: bash
        run: |
          set -o pipefail
          pipe validate --json | tee validate-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-report
          path: validate-report.json

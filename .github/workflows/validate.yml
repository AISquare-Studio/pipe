name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Every connector that registers an aisquare_pipe.toolkits entry point
      # is in the root [toolkits] extra, and nothing else is (reads pyproject
      # files only, so it runs before the install).
      - name: toolkits extra
        run: python scripts/check_toolkits_extra.py

      # One distribution (D8): the framework and every connector are one
      # editable install; [full] brings every connector's deps.
      - name: Install aisquare-pipe[full,dev]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      - name: pipe validate
        shell: bash
        run: |
          set -o pipefail
          pipe validate --json | tee validate-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-report
          path: validate-report.json

  # The Composio connector's suite on both composio-client lines: the pinned
  # floor (composio 0.22.0 + composio-client 1.43.0) and the newest pair the
  # [composio] extra resolves today, so a Dependabot composio bump checks
  # itself. tests/test_sdk_compat.py runs against the real installed SDK.
  composio-sdk:
    name: composio SDK (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: pinned 0.22.0 + 1.43.0
            pins: composio==0.22.0 composio-client==1.43.0
          - sdk: latest
            pins: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: venv with aisquare-pipe[composio,dev]
        env:
          PINS: ${{ matrix.pins }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          # PINS is unquoted on purpose: zero or more requirement words.
          "$RUNNER_TEMP/venv/bin/pip" install -e ".[composio,dev]" $PINS
          "$RUNNER_TEMP/venv/bin/pip" list | grep -i '^composio'

      - name: connectors/composio tests
        working-directory: connectors/composio
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest tests -v'

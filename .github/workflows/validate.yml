name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Every connector that registers an aisquare_pipe.toolkits entry point
      # is in the root [toolkits] extra, and nothing else is (reads pyproject
      # files only, so it runs before the install).
      - name: toolkits extra
        run: python scripts/check_toolkits_extra.py

      # One distribution (D8): the framework and every connector are one
      # editable install; [full] brings every connector's deps.
      - name: Install aisquare-pipe[full,dev]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      - name: pipe validate
        shell: bash
        run: |
          set -o pipefail
          pipe validate --json | tee validate-report.json

      # The install above resolves the newest sqlglot; a host may hold any
      # version the extras allow. So every suite whose extra names sqlglot
      # (the SQL guards) also runs at the floor. The script fails when two
      # extras give sqlglot different specifiers, and when no suite matches;
      # the list is read into a variable first, so that failure stops the
      # step (a failing $(...) in a for list would not), and the step checks
      # that the floor is what got installed and that a suite ran.
      - name: SQL guards at the sqlglot floor
        shell: bash
        run: |
          set -euo pipefail
          pin="$(python scripts/dep_floor.py sqlglot)"
          dirs="$(python scripts/dep_floor.py sqlglot --connectors)"
          pip install "$pin"
          python - "$pin" <<'PY'
          import sys, sqlglot
          want = sys.argv[1].split("==", 1)[1]
          print("sqlglot", sqlglot.__version__)
          assert sqlglot.__version__.startswith(want), (sqlglot.__version__, want)
          PY
          ran=0
          for dir in $dirs; do
            (cd "$dir" && python -m pytest tests -q --no-header -p no:cacheprovider)
            ran=$((ran + 1))
          done
          echo "ran $ran SQL guard suite(s) at $pin"
          test "$ran" -gt 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-report
          path: validate-report.json

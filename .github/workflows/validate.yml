name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Every connector that registers an aisquare_pipe.toolkits entry point
      # is in the root [toolkits] extra, and nothing else is (reads pyproject
      # files only, so it runs before the install).
      - name: toolkits extra
        run: python scripts/check_toolkits_extra.py

      # One distribution (D8): the framework and every connector are one
      # editable install; [full] brings every connector's deps.
      - name: Install aisquare-pipe[full,dev]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      - name: pipe validate
        shell: bash
        run: |
          set -o pipefail
          pipe validate --json | tee validate-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-report
          path: validate-report.json

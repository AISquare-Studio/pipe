version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # One distribution (D8): every dependency, each connector's extra
  # included, is in the root pyproject.toml. connectors/*/pyproject.toml
  # hold tool settings only, so they are not listed.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
